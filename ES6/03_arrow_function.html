<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow function</title>

    <script>
        // 함수를 정의 하는 새로운 문법:화살표 함수  (Arrow function)

        // 1. 기존 방식 - 선언적 함수
        function show(){
            document.write("show!!<br>");
        }
        show();

        // 2. 기존 방식 - 익명함수

        const output= function(){
            document.write("익명함수 output<br>");
        }

        output();


        // 3.새로운 방식 - 화살표 함수 -> 익명 함수를 더욱 간결하게 선언

        let display = ()=>{
            document.write("display 입니다<br>");

        }

        display();
        //화살표 함수로 파라미터를 받을 수 있음
        let display2 = (name)=>{
            document.write('displat2 : ' + name + "<br>")
        }

        display2("sam");
        display2("robin");


        // 만약 화살표 함수의파라미터가 1개라면..( )를 생략해도 된다.

        let display3 =name=>{
            document.write("display3:" + name + "<br>");
        }
    
        display3("hong");

        // 만약 {}실행문 만에 1줄만 있다면  이것도 생략 가능
        let display4 =name=>document.write("display4:" + name + "<br>");
        
        display4('park');

        // 파라미터가 0개 이거나 2개 이상이면 () 생략 불가능 
        let display5 = ()=>document.write("display5<br>" );
        display5();

        const display6 = (name,age)=>document.write(name+','+age+"<br>");
        display6('kim',35);

    </script>
</head>
<body>
    <hr>

    <!-- 화살표 함수는 일반적으로 이벤트 처리용 콜백함수로 많이 사용한다. -->
    <button id="b1"> button</button>
    <h3 id="hh"></h3>
    <script>
        // 1. 버튼의 클릭 이벤트 처리하기
        // 예전 방식 
        const b1 = document.getElementById('b1');
        b1.onclick = function(){
            document.getElementById('hh').innerHTML = 'click button';
        }

        // 화살표 함수사용해서 변경
        b1.onclick = ()=>document.getElementById('hh').innerHTML = "click btn!";

        // 2.반복문 처리할때도 활용
        let aaa = [10,20,30];
        //css선택자로 h3 요소를 찾아서 값들을 출력해보기
        const h3 = document.querySelector('#hh');

        h3.innerHTML = '';
        // 요소가 여러개 이니 += 으로 누적하여 보여주기
        h3.innerHTML += aaa[0]+'<br>';
        h3.innerHTML += aaa[1]+'<br>';
        h3.innerHTML += aaa[2]+'<hr>';

        //반복문으로 위작 업 

        for (let i =0; i<aaa.length; i++){
            h3.innerHTML += aaa[i]+'<br>';

        }
        h3.innerHTML+='<hr>'

        //  위 반복문은 실수의 여지가 있으니 알아서 0부터 요소갯수만큼
        for(i in aaa){
            h3.innerHTML += aaa[i] +"<br>";
        }

        h3.innerHTML+='<hr>'

        // 이것도 짜증.. index 번호를 이용 하기에 요소를 사용할때마다 aaa[i]쓰기가 짜증
        // 배열객체가 본인 요소의 갯수 만큼 반복하는 기능을 가지고 있음
        // foreach 에 전달된 함수가 요소의 갯수만큼 자동으로 실행됨
        aaa.forEach(function(value,index,array){// 요소값 인덱스번호, 배열객체 
            h3.innerHTML += value +"<br>";
            
        });

        h3.innerHTML+='<hr>'
        

        aaa.forEach(function(value){// 순서만 중요할뿐 하나만ㄴ 써도됨
            h3.innerHTML += value +"<br>";
            
        });

        // .forEach()에 지정한 함수를 화살표 함수로 변경하면.. 더 간결해짐
        aaa.forEach((value)=>h3.innerHTML+=value +"<br>");

        // 각각의 요소에 접근 하여 콜백함수의 내용을 수행하고 그 결과를 다시 새로운 배열로 리턴 하는 map()

        // 예) 배열의 각 요소를 제곱한값들을 가진 새로운 배열 만들기
        let bbb =aaa.map(value=> value*value); // 중괄호를 생략하려면 return 과 ; 도 생략해야 한
        document.write(bbb);// JS는 배열을 그대로 출력하면 요소값들을 콤마 구분자로 하여 출력해줌 


    </script>




</body>
</html>
