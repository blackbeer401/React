<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>module</title>

    <!-- 모듈: JS에서 다른 JS 파일에 있는 함수 또는 변수 또는 클래스 등을 가져다 사용하는 기법 -->
    <!-- 이 모듈 기능은 2가지 조건에서 구동된다. : 1 서버 환경에서만 구동가능 2.module type 임을 속성으로 명시해야함 -->
    <!-- 리액트 환경은 기본적으로 이 2가지 조건이 마련된 프로젝트 구조임 -->
    <script type="module">
        // 별도의 js에 있는 show 함수를 불러와 사용해보기..
        // import show from './aa.js'; //export default 된 녀석만 import 가능하다.
        

        // export default 가 아닌 녀석을  import 할때에는 ...{} 가 필요

        // import {output, name, age as a} from './aa.js';

        import show, {output, name , age as a} from './aa.js';

        // impoet 한 함수를 호출해보기
        show();
        output();
        // document.write(name + ','+ age +"<br>")
        alert(name +'\n'+a);


    </script>

   
</head>
<body>
    
</body>
</html>
